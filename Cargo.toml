[package]
name = "subset"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false


[dependencies]
glob = "0.3"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "2.0.119", features = ["full", "visit", "extra-traits"] }
toml = "0.8.2"
