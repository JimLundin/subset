# The Conductor Rust subset: the constructs code may use. `tools/subset check`
# rejects anything not listed here in the files under `include`. The list
# grows only through accepted proposals in docs/subset/proposals/. Each id is
# documented in docs/subset.md.

version = 4

# All of our code is written in the subset. tools/ (the checker itself) and
# vendor/ are outside it for now.
include = ["crates/**/*.rs"]

# Core: data as structs and enums, branching as `match`, iteration as adapters.
allowed = [
  # Items
  "item.struct.named",        # struct with named fields
  "item.struct.newtype",      # struct Id(Ulid); exactly one field
  "item.enum",                # variants may carry data
  "item.fn",
  "item.impl.inherent",
  "item.const",
  "item.use",
  "item.mod",
  "item.fn.async",            # proposal 0006
  "item.fn.receiver.mut",     # proposal 0008
  "item.impl.trait",          # proposal 0009

  # Visibility
  "vis.pub",                  # proposal 0002
  "vis.restricted",           # proposal 0003; pub(crate) only

  # Expressions
  "expr.match",
  "expr.call",
  "expr.method_call",
  "expr.field",
  "expr.struct",              # struct and enum-variant construction
  "expr.path",
  "expr.lit",                 # literals except `true` / `false`
  "expr.block",
  "expr.paren",
  "expr.reference",           # &x
  "expr.try",                 # ?
  "expr.closure.adapter",     # a closure passed straight to an iterator, Option or Result method
  "expr.tuple",               # proposal 0001
  "expr.struct.update",       # proposal 0004
  "expr.unit",                # proposals 0005, 0023
  "expr.async",               # proposal 0006
  "expr.await",               # proposal 0006
  "expr.loop",                # proposal 0007
  "expr.break",               # proposal 0007; `break value` in a drive loop
  "expr.assign",              # proposal 0008
  "expr.reference.mut",       # proposals 0008, 0023
  "expr.array",               # proposal 0015
  "expr.repeat",              # proposal 0015
  "expr.closure",             # proposals 0006, 0017, 0018, 0026; only as the listed calls' argument
  "expr.lit.bool",            # proposals 0021, 0023
  "expr.if_let.single",       # proposal 0027; `if let` with no `else`, `else if` or let-chain
  # Proposal 0028: a boolean expression only as the body of a closure passed
  # straight to `filter`, `find`, `any`, `all`, `position`, `take_while`,
  # `skip_while` or `retain`.
  "expr.binary.eq", "expr.binary.ne",
  "expr.binary.lt", "expr.binary.le", "expr.binary.gt", "expr.binary.ge",
  "expr.binary.and", "expr.binary.or",
  "expr.unary.not",
  "macro.matches",

  # Statements
  "stmt.let",                 # immutable, with a pattern; no `else`
  "stmt.let.mut",             # proposal 0008

  # Patterns
  "pat.ident",
  "pat.path",                 # unit variants and consts
  "pat.struct",
  "pat.tuple_struct",         # Some(x), Ok(x), Variant(x)
  "pat.lit",                  # literals except `true` / `false`
  "pat.or",                   # A | B in one arm
  "pat.wild",                 # `_`, only in positions clippy's wildcard rules allow
  "pat.tuple",                # proposal 0001
  "pat.ident.mut",            # proposal 0008

  # Types
  "type.path",                # except `bool`
  "type.bool",                # proposals 0019, 0023
  "type.reference",
  "type.tuple",               # proposal 0001
  "type.unit",                # proposals 0005, 0023
  "type.reference.mut",       # proposals 0008, 0023
  "type.lifetime",            # proposal 0009
  "type.slice",               # proposal 0014
  "type.array",               # proposal 0015
  "type.impl_trait.arg",      # proposal 0026; only `ask`'s `build` parameter

  # Generics
  "generics.lifetime",        # proposal 0009
  "generics.type_param",      # proposals 0013, 0026

  # Attributes
  "attr.doc",
  "attr.derive",              # only the derives in `derives`
  "attr.cfg_test",            # #[cfg(test)] and #[test]
  "attr.error",               # proposal 0010
  "attr.from",                # proposal 0011
  "attr.cfg",                 # proposal 0016
  "attr.tokio::test",         # proposal 0020

  # Macros
  "macro.allowed",            # only the macros in `macros`
]

derives = [
  "Debug", "Clone", "Copy", "PartialEq", "Eq", "Hash",
  "thiserror::Error",         # proposal 0010
  "PartialOrd", "Ord",        # proposal 0024; only on a newtype whose order means something
]

macros = [
  "format", "write", "writeln",
  "tracing::trace", "tracing::debug", "tracing::info", "tracing::warn", "tracing::error",
  "tokio::select",            # proposal 0007
  "env",                      # proposal 0022
]

# Extra macros allowed only inside #[cfg(test)] code and tests/.
test_macros = ["assert_eq", "assert_ne"]

# Ids allowed only under some paths. Elsewhere, a use of one is reported with
# the scope's rule as the reason.

[[scope]]
rule = "Dioxus only in crates/app (proposal 0018)"
paths = ["crates/app/**"]
allowed = ["macro.rsx", "macro.asset", "attr.component"]

[[scope]]
rule = "a glob import only for `dioxus::prelude::*` in crates/app (proposal 0018)"
paths = ["crates/app/**"]
allowed = ["item.use.glob"]

[[scope]]
rule = "`#![allow]` only for `clippy::useless_format` at the root of crates/app (proposal 0018)"
paths = ["crates/app/src/main.rs"]
allowed = ["attr.allow"]

[[scope]]
rule = "`dyn` only in crates/client/src/platform/ (proposal 0017)"
paths = ["crates/client/src/platform/**"]
allowed = ["type.dyn"]

[[scope]]
rule = "serde derives only on wire types in crates/proto and the agents' provider protocol modules (proposal 0012)"
paths = ["crates/proto/**", "crates/agents/src/*/protocol.rs"]
allowed = ["attr.derive.Serialize", "attr.derive.Deserialize", "attr.serde"]

[[scope]]
rule = "clap only in a binary's main.rs and in examples/ (proposal 0019)"
paths = ["crates/*/src/main.rs", "crates/*/examples/**"]
allowed = [
  "attr.derive.Parser",
  "attr.derive.Subcommand",
  "attr.derive.ValueEnum",
  "attr.command",
  "attr.arg",
]

[[scope]]
rule = "`#[tokio::main]` only in a native binary (proposal 0006)"
paths = ["crates/*/src/main.rs", "crates/*/src/bin/*.rs", "crates/*/examples/*.rs"]
allowed = ["attr.tokio::main"]

# The weighted score (`subset score`, docs/subset.md "Weights"): each token
# costs the weight of the tier of the innermost construct that contains it.
# A violation costs `outside` whatever its id, and a construct whose shape an
# item we don't define fixes costs `boundary`. An allowed id missing from
# `ids` is neutral; a test keeps every allowed id listed here.

[weights]
# Modules that mirror a protocol someone else defines. A field of a type with
# a library derive there is wire data and costs `boundary`.
external_protocols = ["crates/agents/src/claude/**", "crates/agents/src/codex/**"]
# Types that hold data without a type: `type.untyped` wherever they appear.
untyped = ["serde_json::Value", "HashMap<String, _>", "BTreeMap<String, _>", "dyn Any"]
# `adapters` (iterator method names) and `primitives` (type patterns) keep
# the tool's std defaults, listed in tools/subset/README.md.

[weights.tiers]
encouraged = 0.5
neutral = 1.0
tolerated = 2.0
costly = 3.0
outside = 5.0
boundary = 1.0

[weights.ids]
# Encouraged: data as types, decisions as `match`, iteration as adapters.
"item.struct.named" = "encouraged"
"item.struct.newtype" = "encouraged"
"item.enum" = "encouraged"
"type.field" = "encouraged"
"expr.match" = "encouraged"
"pat.ident" = "encouraged"
"pat.path" = "encouraged"
"pat.struct" = "encouraged"
"pat.tuple_struct" = "encouraged"
"pat.lit" = "encouraged"
"pat.or" = "encouraged"
"pat.wild" = "encouraged"
"expr.method_call.adapter" = "encouraged"
"expr.try" = "encouraged"

# Neutral: the rest of the core.
"item.fn" = "neutral"
"item.impl.inherent" = "neutral"
"item.const" = "neutral"
"item.use" = "neutral"
"item.mod" = "neutral"
"vis.pub" = "neutral"
"vis.restricted" = "neutral"
"expr.call" = "neutral"
"expr.method_call" = "neutral"
"expr.field" = "neutral"
"expr.struct" = "neutral"
"expr.struct.update" = "neutral"
"expr.path" = "neutral"
"expr.lit" = "neutral"
"expr.block" = "neutral"
"expr.paren" = "neutral"
"expr.reference" = "neutral"
"expr.closure.adapter" = "neutral"
"expr.array" = "neutral"
"expr.repeat" = "neutral"
"stmt.let" = "neutral"
"type.path" = "neutral"
"type.reference" = "neutral"
"type.slice" = "neutral"
"type.array" = "neutral"
"attr.doc" = "neutral"
"attr.derive" = "neutral"
"attr.cfg_test" = "neutral"
"attr.error" = "neutral"
"attr.from" = "neutral"
"attr.tokio::test" = "neutral"
"attr.serde" = "neutral"
"attr.derive.Serialize" = "neutral"
"attr.derive.Deserialize" = "neutral"
"attr.derive.Parser" = "neutral"
"attr.derive.Subcommand" = "neutral"
"attr.derive.ValueEnum" = "neutral"
"attr.command" = "neutral"
"attr.arg" = "neutral"
"attr.component" = "neutral"
"attr.allow" = "neutral"
"item.use.glob" = "neutral"
"macro.allowed" = "neutral"
"macro.asset" = "neutral"

# Tolerated: accepted compromises.
"item.fn.async" = "tolerated"         # 0006
"expr.async" = "tolerated"
"expr.await" = "tolerated"
"attr.tokio::main" = "tolerated"
"expr.if_let.single" = "tolerated"    # 0027
"stmt.let.discard" = "tolerated"      # 0025
"expr.binary.eq" = "tolerated"        # 0028
"expr.binary.ne" = "tolerated"
"expr.binary.lt" = "tolerated"
"expr.binary.le" = "tolerated"
"expr.binary.gt" = "tolerated"
"expr.binary.ge" = "tolerated"
"expr.binary.and" = "tolerated"
"expr.binary.or" = "tolerated"
"expr.unary.not" = "tolerated"
"macro.matches" = "tolerated"
"type.impl_trait.arg" = "tolerated"   # 0026
"expr.closure" = "tolerated"          # 0006, 0017, 0018, 0026
"generics.type_param" = "tolerated"   # 0013, 0026
"generics.lifetime" = "tolerated"     # 0009
"type.lifetime" = "tolerated"
"item.impl.trait" = "tolerated"       # 0009
"attr.cfg" = "tolerated"              # 0016
"expr.tuple" = "tolerated"            # 0001
"pat.tuple" = "tolerated"
"type.tuple" = "tolerated"
"type.unit" = "tolerated"             # 0005, 0023
"expr.unit" = "tolerated"
"type.bool" = "tolerated"             # 0019, 0023
"expr.lit.bool" = "tolerated"         # 0021, 0023
"type.primitive" = "tolerated"

# Costly: mutation, the actor loop, trait objects, UI markup, untyped data.
"item.fn.receiver.mut" = "costly"     # 0008
"stmt.let.mut" = "costly"
"pat.ident.mut" = "costly"
"expr.assign" = "costly"
"expr.reference.mut" = "costly"
"type.reference.mut" = "costly"
"expr.loop" = "costly"                # 0007
"expr.break" = "costly"
"type.dyn" = "costly"                 # 0017
"macro.rsx" = "costly"                # 0018
"type.untyped" = "costly"
